server:
  port: 8080
spring:
  application:
    name: "AutenticacionService"
  flyway:
    enabled: true
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_AUTH_NAME}"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
  devtools:
    add-properties: false
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: ${DB_PORT}
    database: "${DB_AUTH_NAME}"
    schema: "public"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: 28800000
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
