server:
  port: 8080
spring:
  application:
    name: "AutenticacionService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediva_auth_db"
    schema: "public"
    username: "postgres"
    password: "12345"
  jwt:
    secret: "!49$^LVzHm3tE3$Hz!MQBVuZ%gsNhpdA"
    expiration-ms: 28800000
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
