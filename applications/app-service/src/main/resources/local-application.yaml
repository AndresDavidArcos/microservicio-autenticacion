server:
  port: 8080
spring:
  application:
    name: "AutenticacionService"
  flyway:
    enabled: false
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_AUTH_NAME}"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
  devtools:
    add-properties: false
adapters:
  jwt:
    expiration-ms: 28800000
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"
aws:
  region: "${AWS_REGION:us-east-2}"
  secretName: "crediya"
